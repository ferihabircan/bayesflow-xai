[project]
name = "bayesflow-xai"
version = "0.1.0"
description = "Explainable AI (Integrated Gradients, Saliency Maps, Attention Rollout, Masking) for BayesFlow simulation-based inference models: SIR, Lotka-Volterra, Gaussian Random Field and gravitational waves"
requires-python = ">=3.10"
dependencies = [
    "bayesflow",
    "keras>=3",
    "torch",
    "captum",
    "umap-learn",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "pandas",
    "numpy",
    "FyeldGenerator",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]
gw = ["pycbc"]  # gravitational_wave simulator only

[tool.setuptools.packages.find]
where = ["src"]
