# Same as configs/gravitational_wave_workflow.yaml (original
# GravitationalWaveBenchmarkSimulator + PaperEmbedding CNN + Integrated
# Gradients), but with z-score instead of the original min-max input
# normalisation. Same seed, so the simulated data are identical.
simulator: gravitational_wave
summary_network: gw_paper_cnn
inference_network: coupling_flow
target: mass1          # or mass_ratio
xai_method: integrated_gradients

n_sims: 5000
epochs: 40
batch_size: 32
seed: 42

run_tag: zscore        # outputs: workflow_gravitational_wave_zscore_*
simulator_kwargs:
  normalization: zscore

xai_kwargs:
  n_samples: 64
  internal_batch_size: 64
  save_attributions: true
  n_steps: 200
  baseline: median
