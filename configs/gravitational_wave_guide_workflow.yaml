# Config-driven workflow: the notebook's original gravitational-wave simulator
# (GravitationalWaveBenchmarkSimulator, vendored from sbi-practical-guide) +
# PaperEmbedding CNN + Integrated Gradients (see
# configs/workflow_example.yaml for the full field-by-field docs).
simulator: gravitational_wave_guide
summary_network: gw_paper_cnn
inference_network: coupling_flow
target: mass1          # or mass_ratio
xai_method: integrated_gradients

n_sims: 5000
epochs: 40
batch_size: 32
seed: 42

# Same IG batching as configs/gravitational_wave_workflow.yaml (inputs are
# (8192, 2) here too).
xai_kwargs:
  n_samples: 64
  internal_batch_size: 64
  save_attributions: true
  n_steps: 200         # Captum default 50 left mean |delta| ~0.6 on this model
  baseline: median     # = zero-strain level for both z-score and min-max data
