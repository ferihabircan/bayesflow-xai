# Config-driven workflow: the notebook's original gravitational-wave simulator
# (GravitationalWaveBenchmarkSimulator from sbi-dev/sbi-practical-guide, with
# its original min-max input normalisation) + PaperEmbedding CNN + Integrated
# Gradients (see configs/workflow_example.yaml for the full field-by-field docs).
simulator: gravitational_wave
summary_network: gw_paper_cnn
inference_network: coupling_flow
target: mass1          # or mass_ratio
xai_method: integrated_gradients

n_sims: 5000
epochs: 40
batch_size: 32
seed: 42

# Forwarded to the XAI method. Each input is (8192, 2); Captum expands every
# sample into n_steps interpolation points, so the batch has to be chunked to
# fit on an 11 GB GPU.
xai_kwargs:
  n_samples: 64
  internal_batch_size: 64
  save_attributions: true
  n_steps: 200         # Captum's default 50 left mean |delta| ~0.6
  baseline: median     # = zero-strain level for both min-max and z-score data
